plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.eranalytics'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok 설정
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트 환경에서도 롬복을 사용한다면 아래 내용도 추가
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep the original, psql-compatible SQL intact. Flyway must own the transaction,
// including its history entry, so strip only the outer boundaries in build output.
tasks.named('processResources') {
    from('../../db/migrations') {
        include 'V*__*.sql', 'R__*.sql'
        into 'db/migration'
        filteringCharset = 'UTF-8'
        filter { String line ->
            if (line == 'BEGIN;') return '-- Transaction started by Flyway.'
            if (line == 'COMMIT;') return '-- Transaction committed by Flyway.'
            return line
        }
    }
}

['Info', 'Validate', 'Migrate', 'Baseline'].each { operation ->
    tasks.register("db${operation}", JavaExec) {
        description = "Runs Flyway ${operation.toLowerCase()} using explicit MIGRATION_DATABASE_* credentials."
        group = 'database'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'io.eranalytics.pipeline.migration.DatabaseMigration'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        args operation.toLowerCase()
        if (operation == 'Baseline') {
            doFirst {
                def version = providers.gradleProperty('baselineVersion').orNull
                if (version == null) throw new GradleException('Supply the verified existing version with -PbaselineVersion=<version>')
                args version
            }
        }
    }
}

// 기본 테스트에서는 DB 테스트와 실제 API 테스트 제외
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'postgres'
        excludeTags 'live'
    }
}

// DB 테스트 태스크
tasks.register('integrationTest', Test) {
    description = 'Verifies V1-V4 and JPA persistence in a dedicated PostgreSQL test database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'postgres'
    }
    shouldRunAfter tasks.named('test')
    // A database's contents can change without any source file changing.
    outputs.upToDateWhen { false }
}

tasks.register('stage5Verification', Test) {
    description = 'Bounded real-API verification on an explicitly prepared, isolated production copy.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}
