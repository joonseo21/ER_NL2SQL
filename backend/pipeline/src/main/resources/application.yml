spring:
  application:
    name: er-pipeline
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../../.env[.properties]
  main:
    web-application-type: none
  datasource:
    url: ${COLLECTOR_DATABASE_URL:jdbc:postgresql://localhost:5433/er_analytics}
    username: collector
    password: ${COLLECTOR_PASSWORD:}
  flyway:
    # Schema changes run through DatabaseMigration, never on collector startup.
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

er:
  web-api:
    enabled: ${ER_WEB_API_ENABLED:false}
    frontend-location: ${WEB_API_FRONTEND_LOCATION:classpath:/static/}
    agent:
      mode: ${WEB_API_AGENT_MODE:http}
      base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
      connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:330000}
    datasource:
      url: ${API_SERVER_DATABASE_URL:${COLLECTOR_DATABASE_URL:jdbc:postgresql://localhost:5433/er_analytics}}
      username: api_server
      password: ${API_SERVER_PASSWORD:}
      hikari:
        maximum-pool-size: 3
  api:
    base-url: https://open-api.bser.io
    key: ${ER_API_KEY:}
    season-id: ${ER_SEASON_ID:41}
    requests-per-second: ${ER_REQUESTS_PER_SECOND:0.5}
  collection:
    enabled: ${ER_COLLECTION_ENABLED:false}
    continuous: ${ER_COLLECTION_CONTINUOUS:false}
    revisit-interval: ${ER_REVISIT_INTERVAL:4h}
    max-pages-per-user: ${ER_MAX_PAGES_PER_USER:30}
    idle-sleep: ${ER_IDLE_SLEEP:5m}
    meta-refresh: ${ER_META_REFRESH:24h}
    min-version-major: ${ER_MIN_VERSION_MAJOR:4}
    min-seed-mmr: ${ER_MIN_SEED_MMR:3600}
    balance-basis: ${ER_BALANCE_BASIS:LATEST_PATCH}
    routes-per-game: ${ER_ROUTES_PER_GAME:1}
