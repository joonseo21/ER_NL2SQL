[project]
name = "er-nl2sql-agent"
version = "0.1.0"
description = "Minimal read-only NL2SQL runner for ER analytics"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=27.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
er-agent = "er_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
