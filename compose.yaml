name: er-analytics

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-er_analytics}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      COLLECTOR_PASSWORD: ${COLLECTOR_PASSWORD:?Set COLLECTOR_PASSWORD in .env}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:?Set AGENT_RO_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - er_postgres_data:/var/lib/postgresql/data
      - ./db/init/020-roles.sh:/docker-entrypoint-initdb.d/020-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-er_analytics}"]
      interval: 5s
      timeout: 3s
      retries: 12

  collector:
    profiles: ["collector"]
    image: er-analytics-pipeline:local
    build:
      context: .
      dockerfile: backend/pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COLLECTOR_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-er_analytics}
      COLLECTOR_PASSWORD: ${COLLECTOR_PASSWORD:?Set COLLECTOR_PASSWORD in .env}
      ER_API_KEY: ${ER_API_KEY:?Set ER_API_KEY in .env}
      ER_SEASON_ID: ${ER_SEASON_ID:?Set ER_SEASON_ID in .env}
      ER_REQUESTS_PER_SECOND: ${ER_REQUESTS_PER_SECOND:-0.5}
      ER_COLLECTION_ENABLED: "true"
      ER_COLLECTION_CONTINUOUS: ${ER_COLLECTION_CONTINUOUS:-true}
      ER_REVISIT_INTERVAL: ${ER_REVISIT_INTERVAL:-4h}
      ER_MAX_PAGES_PER_USER: ${ER_MAX_PAGES_PER_USER:-30}
      ER_IDLE_SLEEP: ${ER_IDLE_SLEEP:-5m}
      ER_META_REFRESH: ${ER_META_REFRESH:-24h}
      ER_MIN_VERSION_MAJOR: ${ER_MIN_VERSION_MAJOR:-4}
      ER_MIN_SEED_MMR: ${ER_MIN_SEED_MMR:-3600}
      ER_BALANCE_BASIS: ${ER_BALANCE_BASIS:-LATEST_PATCH}

  migrate:
    profiles: ["migrate"]
    image: er-analytics-pipeline:local
    build:
      context: .
      dockerfile: backend/pipeline/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-er_analytics}
      MIGRATION_DATABASE_USER: postgres
      MIGRATION_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: ["java", "-Dloader.main=io.eranalytics.pipeline.migration.DatabaseMigration", "-cp", "/app/app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    command: ["migrate"]

volumes:
  er_postgres_data:
